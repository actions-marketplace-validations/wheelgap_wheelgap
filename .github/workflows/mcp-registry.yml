name: Publish to the MCP Registry

# Lists wheelgap in the official MCP Registry (registry.modelcontextprotocol.io) from server.json: called by
# publish.yml after each PyPI upload (from the release tag), or run by hand from main. GitHub's OIDC token proves the run belongs to the wheelgap org, so
# no secret is stored; the registry checks PyPI's copy of the README for the mcp-name line. mcp-publisher is pinned
# to a release and checked against its published SHA-256 before it runs.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # for `mcp-publisher login github-oidc`
    env:
      MCP_PUBLISHER_VERSION: v1.8.9
      # From registry_1.8.9_checksums.txt in that release.
      MCP_PUBLISHER_SHA256: 4d527ca8f1ced0394c962dc925c2a4a4addef441cbefd62501c875e9481823a8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive=mcp-publisher_linux_amd64.tar.gz
          curl --fail --location --silent --show-error --output "$archive" \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/$archive"
          echo "${MCP_PUBLISHER_SHA256}  $archive" | sha256sum --check --strict
          tar xzf "$archive" mcp-publisher
          rm "$archive"
      - name: Log in with GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish server.json
        # Right after a release, PyPI can take a few minutes to serve the new version the registry checks.
        run: |
          for attempt in 1 2 3 4; do
            if ./mcp-publisher publish; then exit 0; fi
            [ "$attempt" = 4 ] || sleep 90
          done
          exit 1
