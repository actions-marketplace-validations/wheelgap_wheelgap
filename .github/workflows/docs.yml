name: Docs

# Builds the documentation site (mkdocs.yml, docs/) on every pull request, and deploys it to GitHub Pages
# (https://wheelgap.github.io/wheelgap/) from main. Deploying needs Settings > Pages > Source: GitHub Actions;
# until then the deploy job is skipped, with a notice on the run.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the older build. Deploys queue instead (see deploy).
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # --strict fails the build on a broken link or #anchor, a page missing from the nav, or a bad config.
      - run: uv run --locked --only-group docs mkdocs build --strict --site-dir _site
        env:
          NO_MKDOCS_2_WARNING: "1"
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  # Whether GitHub Pages is set to deploy from GitHub Actions. Nothing here changes the repository's settings.
  pages-enabled:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: read # to read whether Pages is enabled, and how
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if out=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>&1); then
            build_type=$out
          elif [[ $out == *"HTTP 404"* || $out == *"HTTP 403"* ]]; then
            build_type="not enabled, or not readable with this token"
          else
            echo "::error title=Couldn't read the GitHub Pages settings::$out"
            exit 1
          fi
          if [ "$build_type" = workflow ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Docs built but not deployed::GitHub Pages isn't set to deploy from GitHub Actions ($build_type). A maintainer can turn it on in Settings > Pages > Source: GitHub Actions."
          fi

  deploy:
    needs: [build, pages-enabled]
    if: needs.pages-enabled.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write # to deploy to GitHub Pages
      id-token: write # to verify the deployment comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deployment at a time, and don't cancel one that's under way.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
