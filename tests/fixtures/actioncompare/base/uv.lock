version = 1
revision = 3
requires-python = ">=3.13"

# The base side of the GitHub Action's compare-to test (.github/workflows/action-compare.yml): armlib has wheels
# for glibc and musl on both arches.
[[package]]
name = "app"
version = "0.1.0"
source = { virtual = "." }
dependencies = [
    { name = "armlib" },
    { name = "purewheel" },
]

[[package]]
name = "armlib"
version = "1.4.0"
source = { registry = "https://pypi.org/simple" }
sdist = { url = "https://files.pythonhosted.org/packages/aa/armlib-1.4.0.tar.gz", hash = "sha256:00", size = 1 }
wheels = [
    { url = "https://files.pythonhosted.org/packages/aa/armlib-1.4.0-cp313-cp313-manylinux_2_17_aarch64.manylinux2014_aarch64.whl", hash = "sha256:00", size = 1 },
    { url = "https://files.pythonhosted.org/packages/aa/armlib-1.4.0-cp313-cp313-manylinux_2_17_x86_64.manylinux2014_x86_64.whl", hash = "sha256:00", size = 1 },
    { url = "https://files.pythonhosted.org/packages/aa/armlib-1.4.0-cp313-cp313-musllinux_1_2_aarch64.whl", hash = "sha256:00", size = 1 },
    { url = "https://files.pythonhosted.org/packages/aa/armlib-1.4.0-cp313-cp313-musllinux_1_2_x86_64.whl", hash = "sha256:00", size = 1 },
]

[[package]]
name = "purewheel"
version = "3.1"
source = { registry = "https://pypi.org/simple" }
sdist = { url = "https://files.pythonhosted.org/packages/aa/purewheel-3.1.tar.gz", hash = "sha256:00", size = 1 }
wheels = [
    { url = "https://files.pythonhosted.org/packages/aa/purewheel-3.1-py3-none-any.whl", hash = "sha256:00", size = 1 },
]
